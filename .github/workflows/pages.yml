# Builds the gallery with scripts/build-site.mjs and publishes it to GitHub Pages.
# Repository settings: Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "runs/**"
      - "prompts/**"
      - "skills/**"
      - "research/candidates.json"
      - "site/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  # Rebuild every 6 hours so the 👍 counts on the comparison pages stay current.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Read-only: the build reads 👍 counts from the Votes discussions and writes nothing back.
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm install: the build script has no dependencies.
      - name: Build site
        run: node scripts/build-site.mjs --out _site
        env:
          # Used only to read vote counts (GraphQL, discussions: read).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
