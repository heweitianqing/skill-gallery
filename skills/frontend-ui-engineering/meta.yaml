# Skill files are not stored in this repo. `node scripts/fetch-skill.mjs frontend-ui-engineering`
# downloads them at the pinned commit into .cache/skills/ (git-ignored).
name: frontend-ui-engineering
summary: >-
  Engineering-quality front-end skill by Addy Osmani: accessible, responsive UIs
  with loading, empty and error states, semantic tokens and a table of "AI
  aesthetic" defaults to avoid. Instructions only, no scripts.
research_id: addyosmani-frontend-ui-engineering   # research/candidates.json

upstream:
  repo: https://github.com/addyosmani/agent-skills
  commit: aeac41d4d005999432bb7312f7ff06383a91d59d
  path: skills/frontend-ui-engineering
  skill_md: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md

license:
  spdx: MIT
  file: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/LICENSE
  in_skill_folder: false
  copyright: Copyright (c) 2025 Addy Osmani

fetch:
  method: git

install:
  claude: Copy the folder to <project>/.claude/skills/frontend-ui-engineering/
  codex: Copy the folder to <project>/.agents/skills/frontend-ui-engineering/

invoke:
  claude: "Use the frontend-ui-engineering skill."
  codex: "$frontend-ui-engineering"

strengths:
  - text: Builds production-quality, accessible, responsive user-facing UIs
    source: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md#L3
  - text: UI that looks like it was built by a design-aware engineer at a top company, not generated by an AI
    source: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md#L10
  - text: WCAG 2.1 AA accessibility, with keyboard navigation and focus management
    source: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md#L176
  - text: Meaningful empty, error and loading states
    source: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md#L233
  - text: Avoids the "AI aesthetic" (purple gradients, rounded everything, generic heroes, heavy shadows)
    source: https://github.com/addyosmani/agent-skills/blob/aeac41d4d005999432bb7312f7ff06383a91d59d/skills/frontend-ui-engineering/SKILL.md#L129

# "Building new UI components or pages", no exclusions; form-states is its showcase prompt.
applies_to: [landing-saas, dashboard, blog-portfolio, form-states]
applies_to_note: Decided from the skill text before the batch-2 runs; form-states was added to show its accessibility and state handling.

notes:
  - The "See Also" link (../../references/accessibility-checklist.md) points outside the skill folder and is not copied.
  - Part of a 25-skill repo; install only this folder, not the plugin.
  - Its main strengths (accessibility, loading/empty/error states) are not visible in screenshots of the three standard prompts; see the form-states showcase prompt and each cell's a11y scan.
